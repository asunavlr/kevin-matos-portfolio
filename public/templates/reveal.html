<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reveal Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#faf9f5; --card:#f0eee6; --ink:#141413; --mute:#5e5d59; --line:#e3e1d7; --e:cubic-bezier(.22,1,.36,1); }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Instrument Sans",sans-serif; }
  .bar { position:sticky; top:0; z-index:10; background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .bar .in { max-width:1100px; margin:auto; padding:14px 20px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; align-items:center; }
  .bar b { font-weight:600; margin-right:8px; white-space:nowrap; }
  .bar button { flex:none; border:1px solid var(--line); background:transparent; border-radius:99px; padding:7px 14px; font:inherit; font-size:13.5px; color:var(--mute); cursor:pointer; }
  .bar button.on { border-color:var(--ink); color:var(--ink); }
  .note { max-width:1100px; margin:auto; padding:18px 20px 0; color:var(--mute); font-size:14px; }
  main { max-width:1100px; margin:auto; padding:0 20px 40vh; }
  .hero { height:70vh; display:flex; flex-direction:column; justify-content:center; }
  .hero h1 { font-family:Newsreader,serif; font-weight:400; font-size:clamp(36px,6vw,64px); }
  .hero p { color:var(--mute); margin-top:12px; }
  section { border-top:1px solid var(--line); padding:72px 0; }
  .eyebrow { font-size:13.5px; color:var(--mute); }
  h2 { font-family:Newsreader,serif; font-weight:400; font-size:clamp(28px,4vw,40px); line-height:1.15; margin-top:8px; }
  .sub { color:var(--mute); max-width:520px; margin-top:12px; line-height:1.6; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px; margin-top:40px; }
  .card { background:var(--card); aspect-ratio:4/3; padding:20px; display:flex; flex-direction:column; justify-content:flex-end; }
  .card span { font-size:13px; color:var(--mute); }
  .card strong { font-size:17px; font-weight:600; margin-top:4px; }

  /* Base: elementos marcados com [data-r] ficam escondidos até entrar na tela. */
  [data-r] { transition-property:opacity,transform,filter,clip-path; transition-timing-function:var(--e); will-change:opacity,transform,filter; }

  /* A: fade up */
  .A [data-r] { opacity:0; transform:translateY(24px); transition-duration:.9s; }
  /* B: blur in */
  .B [data-r] { opacity:0; filter:blur(14px); transition-duration:1s; }
  /* C: blur + sobe + escala */
  .C [data-r] { opacity:0; filter:blur(10px); transform:translateY(30px) scale(.97); transition-duration:1.1s; }
  /* D: palavras desfocadas em cascata (títulos) + cards blur */
  .D [data-r] { opacity:0; filter:blur(8px); transform:translateY(12px); transition-duration:.9s; }
  .D .w { display:inline-block; opacity:0; filter:blur(10px); transform:translateY(10px); transition:all .8s var(--e); }
  .D .in-view .w { opacity:1; filter:none; transform:none; }
  /* E: máscara subindo (clip-path) */
  .E [data-r] { clip-path:inset(100% 0 0 0); transform:translateY(20px); transition-duration:1.1s; }
  /* G: blur forte com leve zoom out */
  .G [data-r] { opacity:0; filter:blur(20px); transform:scale(1.06); transition-duration:1.3s; }

  .in-view[data-r], .in-view [data-r] { opacity:1; filter:none; transform:none; clip-path:inset(0 0 0 0); }
  /* F (scroll-linked): estilos aplicados inline pelo JS conforme o scroll */
  .F [data-r] { transition:none; }
</style>
</head>
<body>
<div class="bar"><div class="in" id="tabs"><b>Reveal</b></div></div>
<p class="note" id="desc"></p>
<main id="root"></main>
<script>
const V = {
  A: ["Fade up", "Soft fade and 24px rise. Clean and safe."],
  B: ["Blur in", "Content starts out of focus and sharpens in place."],
  C: ["Blur + rise", "Blur, rise and a tiny scale. Feels premium."],
  D: ["Word blur", "Titles reveal word by word out of blur, cards follow."],
  E: ["Mask up", "Content is uncovered from the bottom, like a curtain."],
  F: ["Scroll-linked blur", "Tied to your scroll: blur and opacity follow the scrollbar, scrubbing back if you scroll up."],
  G: ["Focus pull", "Strong blur with a slow zoom out, like a camera focusing."],
};
const items = [["Customer service platform","Avodah SAC"],["News portal","Goiás Direto"],["Agro media","AgroPujante"],["Data","Dados Fazenda"],["Education","EscolaPujante"],["Prospecting","Prospect Comply"]];
const sec = (e, t, s) => `<section data-sec><div data-r><p class="eyebrow">${e}</p><h2 class="t">${t}</h2><p class="sub">${s}</p></div>
  <div class="grid">${items.map(([k,n],i)=>`<div class="card" data-r data-i="${i}"><span>${k}</span><strong>${n}</strong></div>`).join("")}</div></section>`;
const html = `<div class="hero"><h1>Scroll down slowly.</h1><p>Each section reveals with the selected style.</p></div>
  ${sec("Work","Products I've shipped.","Real work for real clients, built end to end.")}
  ${sec("Open source","The engineering, in public.","Small, focused repos with tests.")}
  ${sec("Experience","Where I've worked.","From agencies to products.")}
  ${sec("Contact","Let's build something.","Moving to Dublin in January 2027.")}`;

let io, onScroll;
function mount(k) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.k === k));
  document.getElementById("desc").textContent = V[k][1];
  const root = document.getElementById("root");
  root.className = k; root.innerHTML = html; scrollTo(0, 0);
  if (k === "D") root.querySelectorAll(".t").forEach(h => h.innerHTML = h.textContent.split(" ").map((w,i)=>`<span class="w" style="transition-delay:${i*70}ms">${w}</span>`).join(" "));
  io?.disconnect(); removeEventListener("scroll", onScroll);
  if (k === "F") {
    const els = [...root.querySelectorAll("[data-r]")];
    onScroll = () => els.forEach(el => {
      const r = el.getBoundingClientRect(), h = innerHeight;
      const p = Math.min(1, Math.max(0, (h - r.top) / (h * 0.35)));
      el.style.opacity = p; el.style.filter = `blur(${(1-p)*12}px)`; el.style.transform = `translateY(${(1-p)*40}px)`;
    });
    addEventListener("scroll", onScroll, { passive: true }); onScroll(); return;
  }
  /* Cards entram em cascata; o resto com o próprio atraso zero. */
  root.querySelectorAll("[data-i]").forEach(c => c.style.transitionDelay = `${(c.dataset.i % 3) * 90}ms`);
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in-view"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -12% 0px" });
  root.querySelectorAll("[data-r]").forEach(el => io.observe(el));
}
const tabs = document.getElementById("tabs");
Object.entries(V).forEach(([k,[n]]) => { const b = document.createElement("button"); b.dataset.k = k; b.textContent = `${k} · ${n}`; b.onclick = () => mount(k); tabs.append(b); });
mount(location.hash.slice(1) in V ? location.hash.slice(1) : "A");
</script>
</body>
</html>
